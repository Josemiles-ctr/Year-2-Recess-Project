[project]
name = "year-2-recess"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1",
    "python-dotenv>=1.0",
    "numpy>=1.24.0",
    "pillow>=9.5.0",
    "opencv-python-headless>=4.7.0",
    "scikit-image>=0.20.0",
    "scikit-learn>=1.2.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["notebooks/"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
# Include root directory in extraPaths so 'src.xxx' imports resolve correctly in Pyright/Pylance
extraPaths = ["."]

